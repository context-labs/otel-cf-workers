name: Pull Request

on: pull_request

jobs:
  check:
    name: 'Checks'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-checks
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'canary'
      - name: Report Bun revision
        run: bun --version && bun --revision
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format and type check
        run: bun run check
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
