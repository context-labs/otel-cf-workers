name: Main branch

# This flow will re-run tests on the main branch after a PR has been merged.

on:
  push:
    branches:
      - main

jobs:
  test:
    name: 'Tests'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'canary'
      - name: Report Bun revision
        run: bun --version && bun --revision
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format and type check
        run: bun run check
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
